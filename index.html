<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>Hexel Art Maker</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --panel: #16213e;
      --accent: #0f3460;
      --text: #eaeaea;
      --highlight: #e94560;
      --border: #0f3460;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
    }

    /* ===== Header ===== */
    header {
      background: var(--panel);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 20;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    header .subtitle { font-size: 0.7rem; opacity: 0.55; margin-left: 6px; }
    .header-btns { display: flex; gap: 8px; }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--accent);
      border: none;
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .icon-btn:active { background: #1a4a7a; }

    /* ===== Layout ===== */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    .canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d1a;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    canvas {
      background: #111;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      touch-action: none;
      max-width: 100%;
      max-height: 100%;
    }

    /* ===== Desktop Sidebar ===== */
    .sidebar {
      width: 280px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }

    /* ===== Mobile Bottom Bar ===== */
    .mobile-bar {
      display: none;
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 8px 10px calc(8px + var(--safe-bottom));
      flex-direction: column;
      gap: 8px;
      z-index: 30;
      flex-shrink: 0;
    }
    .mobile-tools {
      display: flex;
      gap: 6px;
      justify-content: space-between;
    }
    .mobile-tools .tool-btn {
      flex: 1;
      padding: 12px 4px;
      font-size: 0.7rem;
      min-height: 54px;
    }
    .mobile-color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mobile-color-row input[type="color"] {
      width: 44px; height: 44px;
      border-radius: 10px;
      border: none;
      padding: 0;
      background: none;
      flex-shrink: 0;
    }
    .mobile-color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .mobile-color-row input[type="color"]::-webkit-color-swatch {
      border: 2px solid #fff;
      border-radius: 8px;
    }
    .mobile-swatches {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      flex: 1;
      padding: 2px 0;
      -webkit-overflow-scrolling: touch;
    }
    .mobile-swatches .swatch {
      width: 34px; height: 34px;
      border-radius: 8px;
      flex-shrink: 0;
      border: 2px solid transparent;
    }
    .mobile-swatches .swatch.active { border-color: #fff; }
    .mobile-actions {
      display: flex;
      gap: 6px;
    }
    .mobile-actions .btn {
      flex: 1;
      padding: 11px 6px;
      font-size: 0.8rem;
      min-height: 44px;
    }

    /* ===== Shared UI pieces ===== */
    .section { display: flex; flex-direction: column; gap: 8px; }
    .section-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.5;
      font-weight: 600;
    }
    .tools {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .tool-btn {
      background: var(--accent);
      border: 2px solid transparent;
      color: var(--text);
      padding: 10px 4px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.72rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: background 0.12s, border-color 0.12s;
    }
    .tool-btn:active, .tool-btn.active {
      border-color: var(--highlight);
      background: #1a3a5c;
    }
    .tool-btn svg { width: 22px; height: 22px; }

    .color-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input[type="color"] {
      width: 48px; height: 48px;
      border: none; border-radius: 10px;
      cursor: pointer; background: none; padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 2px solid #fff; border-radius: 8px;
    }
    .current-color {
      flex: 1; height: 48px; border-radius: 10px;
      border: 2px solid #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-family: monospace;
      text-shadow: 0 1px 2px rgba(0,0,0,0.85);
    }
    .palette {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
    }
    .swatch {
      aspect-ratio: 1;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .swatch.active { border-color: #fff; }

    .controls { display: flex; flex-direction: column; gap: 10px; }
    label {
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--highlight);
      height: 28px;
    }
    input[type="checkbox"] {
      width: 20px; height: 20px;
      accent-color: var(--highlight);
    }

    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn {
      background: var(--accent);
      border: none;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      flex: 1;
      min-width: 70px;
      min-height: 42px;
    }
    .btn:active { background: #1a4a7a; }
    .btn.danger { background: #5c1a1a; }
    .btn.danger:active { background: #7a2222; }
    .btn.primary { background: var(--highlight); }
    .btn.primary:active { background: #ff6b81; }

    .info {
      font-size: 0.68rem;
      opacity: 0.5;
      line-height: 1.4;
    }
    .status {
      position: absolute;
      bottom: 10px; left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-family: monospace;
      pointer-events: none;
      z-index: 5;
    }

    /* ===== Mobile sheet (settings) ===== */
    .sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 40;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .sheet-overlay.open { display: block; opacity: 1; }
    .sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: var(--panel);
      border-radius: 18px 18px 0 0;
      padding: 16px 16px calc(16px + var(--safe-bottom));
      z-index: 50;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 78vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 36px; height: 4px;
      background: #ffffff44;
      border-radius: 2px;
      margin: 0 auto 14px;
    }
    .sheet h2 {
      font-size: 1.05rem;
      margin-bottom: 14px;
      text-align: center;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .mobile-bar { display: flex; }
      header h1 .subtitle { display: none; }
      .canvas-wrap { padding-bottom: 0; }
    }
    @media (min-width: 769px) {
      .mobile-bar { display: none !important; }
      .icon-btn#settingsBtn { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>⬡ Hexel Art Maker <span class="subtitle">flat-top</span></h1>
    <div class="header-btns">
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <div class="main">
    <!-- Desktop sidebar -->
    <aside class="sidebar" id="desktopSidebar">
      <div class="section">
        <div class="section-title">Tools</div>
        <div class="tools" id="desktopTools"></div>
      </div>
      <div class="section">
        <div class="section-title">Color</div>
        <div class="color-row">
          <input type="color" id="colorPicker" value="#e94560">
          <div class="current-color" id="currentColorDisplay" style="background:#e94560">#e94560</div>
        </div>
        <div class="palette" id="palette"></div>
      </div>
      <div class="section">
        <div class="section-title">Grid</div>
        <div class="controls">
          <label>Cols <span id="colsVal">12</span></label>
          <input type="range" id="cols" min="4" max="40" value="12">
          <label>Rows <span id="rowsVal">10</span></label>
          <input type="range" id="rows" min="4" max="40" value="10">
          <label>Hex Size <span id="sizeVal">28</span></label>
          <input type="range" id="hexSize" min="12" max="60" value="28">
          <label style="justify-content:flex-start;gap:10px">
            <input type="checkbox" id="showGrid" checked> Show grid lines
          </label>
        </div>
      </div>
      <div class="section">
        <div class="section-title">Actions</div>
        <div class="btn-row">
          <button class="btn" id="undoBtn">Undo</button>
          <button class="btn" id="redoBtn">Redo</button>
        </div>
        <div class="btn-row">
          <button class="btn danger" id="clearBtn">Clear</button>
          <button class="btn primary" id="exportBtn">Export PNG</button>
        </div>
      </div>
      <div class="info">
        Flat-top hexagons • Click/drag to paint<br>
        Keys: P Pencil • E Eraser • F Fill • I Pick
      </div>
    </aside>

    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div class="status" id="status">q:0 r:0</div>
    </div>
  </div>

  <!-- Mobile bottom bar -->
  <div class="mobile-bar" id="mobileBar">
    <div class="mobile-tools" id="mobileTools"></div>
    <div class="mobile-color-row">
      <input type="color" id="mobileColorPicker" value="#e94560">
      <div class="mobile-swatches" id="mobileSwatches"></div>
    </div>
    <div class="mobile-actions">
      <button class="btn" id="mUndo">Undo</button>
      <button class="btn" id="mRedo">Redo</button>
      <button class="btn danger" id="mClear">Clear</button>
      <button class="btn primary" id="mExport">Export</button>
    </div>
  </div>

  <!-- Settings sheet (mobile) -->
  <div class="sheet-overlay" id="sheetOverlay"></div>
  <div class="sheet" id="settingsSheet">
    <div class="sheet-handle"></div>
    <h2>Grid Settings</h2>
    <div class="controls" style="gap:14px">
      <label>Columns <span id="mColsVal">12</span></label>
      <input type="range" id="mCols" min="4" max="40" value="12">
      <label>Rows <span id="mRowsVal">10</span></label>
      <input type="range" id="mRows" min="4" max="40" value="10">
      <label>Hex Size <span id="mSizeVal">28</span></label>
      <input type="range" id="mHexSize" min="12" max="60" value="28">
      <label style="justify-content:flex-start;gap:12px">
        <input type="checkbox" id="mShowGrid" checked> Show grid lines
      </label>
    </div>
    <div style="margin-top:18px">
      <button class="btn primary" style="width:100%" id="closeSheet">Done</button>
    </div>
  </div>

  <script>
    // ========== Hex math (flat-top) ==========
    const SQRT3 = Math.sqrt(3);

    function hexToPixel(q, r, size) {
      const x = size * (1.5 * q);
      const y = size * (SQRT3/2 * q + SQRT3 * r);
      return { x, y };
    }

    function pixelToHex(px, py, size) {
      const q = (2/3 * px) / size;
      const r = (-1/3 * px + SQRT3/3 * py) / size;
      return hexRound(q, r);
    }

    function hexRound(q, r) {
      let s = -q - r;
      let rq = Math.round(q);
      let rr = Math.round(r);
      let rs = Math.round(s);
      const qDiff = Math.abs(rq - q);
      const rDiff = Math.abs(rr - r);
      const sDiff = Math.abs(rs - s);
      if (qDiff > rDiff && qDiff > sDiff) rq = -rr - rs;
      else if (rDiff > sDiff) rr = -rq - rs;
      return { q: rq, r: rr };
    }

    function hexCorners(cx, cy, size) {
      const corners = [];
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 180) * (60 * i); // flat-top
        corners.push({
          x: cx + size * Math.cos(angle),
          y: cy + size * Math.sin(angle)
        });
      }
      return corners;
    }

    // ========== State ==========
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    let cols = 12, rows = 10, hexSize = 28, showGrid = true;
    let currentColor = '#e94560';
    let tool = 'pencil';
    let isDrawing = false;
    let lastHex = null;
    let cells = new Map();
    let history = [];
    let historyIndex = -1;
    const MAX_HISTORY = 50;

    const defaultPalette = [
      '#000000','#ffffff','#e94560','#0f3460','#16213e',
      '#53d8fb','#f9c74f','#90be6d','#f94144','#f3722c',
      '#43aa8b','#577590','#9b5de5','#f15bb5','#00bbf9',
      '#fee440','#8ecae6','#219ebc','#023047','#ffb703'
    ];

    const toolDefs = [
      { id: 'pencil', label: 'Pencil', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/></svg>' },
      { id: 'eraser', label: 'Eraser', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16c-1.1-1.1-1.1-2.9 0-4l9.5-9.5c1.1-1.1 2.9-1.1 4 0L20 10.5"/><path d="M18 13l-5 5"/></svg>' },
      { id: 'fill', label: 'Fill', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 11H5"/><path d="M19 15H5"/><path d="M12 3v18"/></svg>' },
      { id: 'eyedropper', label: 'Pick', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 22l1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="M15 6l3 3"/><path d="M18 3l3 3-3 3-3-3 3-3z"/></svg>' }
    ];

    // Build tool buttons
    function buildTools(container) {
      container.innerHTML = '';
      toolDefs.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'tool-btn' + (t.id === tool ? ' active' : '');
        btn.dataset.tool = t.id;
        btn.innerHTML = t.icon + t.label;
        btn.addEventListener('click', () => setTool(t.id));
        container.appendChild(btn);
      });
    }
    buildTools(document.getElementById('desktopTools'));
    buildTools(document.getElementById('mobileTools'));

    // Palette
    function buildPalette(container, isMobile = false) {
      container.innerHTML = '';
      defaultPalette.forEach(c => {
        const sw = document.createElement('div');
        sw.className = 'swatch' + (c === currentColor ? ' active' : '');
        sw.style.background = c;
        sw.dataset.color = c;
        sw.addEventListener('click', () => setColor(c));
        container.appendChild(sw);
      });
    }
    buildPalette(document.getElementById('palette'));
    buildPalette(document.getElementById('mobileSwatches'), true);

    // Color
    function setColor(c) {
      currentColor = c;
      document.getElementById('colorPicker').value = c;
      document.getElementById('mobileColorPicker').value = c;
      const disp = document.getElementById('currentColorDisplay');
      if (disp) {
        disp.style.background = c;
        disp.textContent = c;
      }
      document.querySelectorAll('.swatch').forEach(s => {
        s.classList.toggle('active', s.dataset.color === c);
      });
    }
    document.getElementById('colorPicker').addEventListener('input', e => setColor(e.target.value));
    document.getElementById('mobileColorPicker').addEventListener('input', e => setColor(e.target.value));

    function setTool(t) {
      tool = t;
      document.querySelectorAll('.tool-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tool === t);
      });
    }

    // Grid controls (desktop + mobile sheet)
    function bindRange(id, mId, valId, mValId, key) {
      const el = document.getElementById(id);
      const mEl = document.getElementById(mId);
      const update = (v) => {
        if (key === 'cols') cols = v;
        else if (key === 'rows') rows = v;
        else hexSize = v;
        document.getElementById(valId).textContent = v;
        document.getElementById(mValId).textContent = v;
        el.value = v;
        mEl.value = v;
        resizeAndRedraw();
      };
      el.addEventListener('input', e => update(+e.target.value));
      mEl.addEventListener('input', e => update(+e.target.value));
    }
    bindRange('cols', 'mCols', 'colsVal', 'mColsVal', 'cols');
    bindRange('rows', 'mRows', 'rowsVal', 'mRowsVal', 'rows');
    bindRange('hexSize', 'mHexSize', 'sizeVal', 'mSizeVal', 'size');

    document.getElementById('showGrid').addEventListener('change', e => {
      showGrid = e.target.checked;
      document.getElementById('mShowGrid').checked = showGrid;
      draw();
    });
    document.getElementById('mShowGrid').addEventListener('change', e => {
      showGrid = e.target.checked;
      document.getElementById('showGrid').checked = showGrid;
      draw();
    });

    // Actions
    document.getElementById('clearBtn').addEventListener('click', doClear);
    document.getElementById('mClear').addEventListener('click', doClear);
    document.getElementById('exportBtn').addEventListener('click', exportPNG);
    document.getElementById('mExport').addEventListener('click', exportPNG);
    document.getElementById('undoBtn').addEventListener('click', undo);
    document.getElementById('mUndo').addEventListener('click', undo);
    document.getElementById('redoBtn').addEventListener('click', redo);
    document.getElementById('mRedo').addEventListener('click', redo);

    function doClear() {
      if (confirm('Clear the entire canvas?')) {
        pushHistory();
        cells.clear();
        draw();
      }
    }

    // Settings sheet
    const sheet = document.getElementById('settingsSheet');
    const overlay = document.getElementById('sheetOverlay');
    document.getElementById('settingsBtn').addEventListener('click', () => {
      sheet.classList.add('open');
      overlay.classList.add('open');
    });
    function closeSheet() {
      sheet.classList.remove('open');
      overlay.classList.remove('open');
    }
    document.getElementById('closeSheet').addEventListener('click', closeSheet);
    overlay.addEventListener('click', closeSheet);

    // Keyboard (desktop)
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      const k = e.key.toLowerCase();
      if (k === 'p') setTool('pencil');
      else if (k === 'e') setTool('eraser');
      else if (k === 'f') setTool('fill');
      else if (k === 'i') setTool('eyedropper');
      else if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); undo(); }
      else if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); }
    });

    // History
    function pushHistory() {
      history = history.slice(0, historyIndex + 1);
      history.push(new Map(cells));
      if (history.length > MAX_HISTORY) history.shift();
      else historyIndex++;
    }
    function undo() {
      if (historyIndex <= 0) return;
      historyIndex--;
      cells = new Map(history[historyIndex]);
      draw();
    }
    function redo() {
      if (historyIndex >= history.length - 1) return;
      historyIndex++;
      cells = new Map(history[historyIndex]);
      draw();
    }

    // Canvas size
    function getCanvasSize() {
      const width = Math.ceil(hexSize * (1.5 * (cols - 1) + 2) + 24);
      const height = Math.ceil(hexSize * SQRT3 * (rows + 0.5) + 24);
      return { width, height };
    }

    function resizeAndRedraw() {
      const { width, height } = getCanvasSize();
      canvas.width = width;
      canvas.height = height;
      // prune out-of-bounds
      for (const key of [...cells.keys()]) {
        const [q, r] = key.split(',').map(Number);
        if (q < 0 || q >= cols || r < 0 || r >= rows) cells.delete(key);
      }
      draw();
    }

    // Drawing
    function drawHex(q, r, color) {
      const { x, y } = hexToPixel(q, r, hexSize);
      const ox = hexSize + 12;
      const oy = hexSize * SQRT3 / 2 + 12;
      const cx = x + ox;
      const cy = y + oy;
      const corners = hexCorners(cx, cy, hexSize * 0.97);

      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 6; i++) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();

      if (color) {
        ctx.fillStyle = color;
        ctx.fill();
      }
      if (showGrid) {
        ctx.strokeStyle = '#ffffff22';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let q = 0; q < cols; q++) {
        for (let r = 0; r < rows; r++) {
          const color = cells.get(`${q},${r}`) || null;
          drawHex(q, r, color);
        }
      }
    }

    // Interaction
    function getHexAtEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.clientX ?? (e.touches && e.touches[0]?.clientX);
      const clientY = e.clientY ?? (e.touches && e.touches[0]?.clientY);
      if (clientX == null) return { q: -1, r: -1 };
      const px = (clientX - rect.left) * scaleX;
      const py = (clientY - rect.top) * scaleY;
      const ox = hexSize + 12;
      const oy = hexSize * SQRT3 / 2 + 12;
      return pixelToHex(px - ox, py - oy, hexSize);
    }

    function isInBounds(q, r) {
      return q >= 0 && q < cols && r >= 0 && r < rows;
    }

    function paintHex(q, r) {
      if (!isInBounds(q, r)) return;
      const key = `${q},${r}`;
      if (tool === 'pencil') {
        if (cells.get(key) !== currentColor) cells.set(key, currentColor);
      } else if (tool === 'eraser') {
        cells.delete(key);
      } else if (tool === 'eyedropper') {
        const c = cells.get(key);
        if (c) setColor(c);
      }
    }

    function floodFill(startQ, startR, targetColor, fillColor) {
      if (targetColor === fillColor) return;
      const stack = [{ q: startQ, r: startR }];
      const visited = new Set();
      const dirs = [
        { dq: 1, dr: 0 }, { dq: 1, dr: -1 }, { dq: 0, dr: -1 },
        { dq: -1, dr: 0 }, { dq: -1, dr: 1 }, { dq: 0, dr: 1 }
      ];
      while (stack.length) {
        const { q, r } = stack.pop();
        const key = `${q},${r}`;
        if (visited.has(key) || !isInBounds(q, r)) continue;
        visited.add(key);
        const cellColor = cells.get(key) || null;
        if (cellColor !== targetColor) continue;
        if (fillColor === null) cells.delete(key);
        else cells.set(key, fillColor);
        for (const d of dirs) stack.push({ q: q + d.dq, r: r + d.dr });
      }
    }

    function handlePointer(e) {
      e.preventDefault();
      const hex = getHexAtEvent(e);
      statusEl.textContent = `q:${hex.q} r:${hex.r}`;
      if (!isInBounds(hex.q, hex.r)) return;

      if (tool === 'fill' && (e.type === 'pointerdown' || e.type === 'touchstart')) {
        pushHistory();
        const target = cells.get(`${hex.q},${hex.r}`) || null;
        floodFill(hex.q, hex.r, target, currentColor);
        draw();
        return;
      }
      if (tool === 'eyedropper' && (e.type === 'pointerdown' || e.type === 'touchstart')) {
        paintHex(hex.q, hex.r);
        return;
      }
      if (isDrawing) {
        if (lastHex && lastHex.q === hex.q && lastHex.r === hex.r) return;
        paintHex(hex.q, hex.r);
        lastHex = hex;
        draw();
      }
    }

    // Pointer events (works for mouse + touch on modern browsers)
    canvas.addEventListener('pointerdown', e => {
      canvas.setPointerCapture(e.pointerId);
      isDrawing = true;
      lastHex = null;
      if (tool === 'pencil' || tool === 'eraser') pushHistory();
      handlePointer(e);
    });
    canvas.addEventListener('pointermove', e => {
      if (!isDrawing) {
        const hex = getHexAtEvent(e);
        statusEl.textContent = `q:${hex.q} r:${hex.r}`;
        return;
      }
      handlePointer(e);
    });
    canvas.addEventListener('pointerup', () => { isDrawing = false; lastHex = null; });
    canvas.addEventListener('pointercancel', () => { isDrawing = false; lastHex = null; });

    // Extra touch prevention for iOS
    canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    function exportPNG() {
      const link = document.createElement('a');
      link.download = `hexel-art-${cols}x${rows}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Init
    history = [new Map()];
    historyIndex = 0;
    resizeAndRedraw();

    // Prevent iOS bounce / zoom gestures on body
    document.body.addEventListener('touchmove', e => {
      if (e.target === canvas || canvas.contains(e.target)) return;
      // allow scrolling inside sheet / sidebar
      if (e.target.closest('.sheet') || e.target.closest('.sidebar') || e.target.closest('.mobile-swatches')) return;
      e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
